name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, secrets, PINs, tokens or customer data. Use made-up values.
        For security reports, use the repository's private vulnerability reporting instead of an issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version and the spec version it was built against
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Language and runtime version, and operating system
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal example with made-up data
    validations:
      required: true
